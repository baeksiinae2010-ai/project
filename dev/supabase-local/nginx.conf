# Fronts PostgREST so it answers on the Supabase REST path the client expects:
# <SUPABASE_URL>/rest/v1/<table>  ->  PostgREST /<table>
server {
    listen 80;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
